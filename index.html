<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Koleksi Dr Excel</title>
<link rel="stylesheet" href="sys/style.css">
</head>
<body>
<div id="announceBar" class="announce-bar hidden" title="WhatsApp Dr Excel">
  <span id="announceText"></span>
  <button id="announceClose" class="announce-close" title="Tutup" aria-label="Tutup pengumuman">✕</button>
</div>
<main id="view">
  <!-- HOME -->
  <section id="page-home" class="page active">
    <div class="row" style="justify-content:flex-end">
      <button id="homeEditBtn" class="btn small admin-only hidden">Edit</button>
    </div>
    <header class="home-head">
      <div class="hh-logo">
        <img id="homeLogo" alt="Logo" onerror="this.classList.add('hidden');document.getElementById('homeLogoFb').classList.remove('hidden')">
        <span id="homeLogoFb" class="hidden">DR. EXCEL</span>
      </div>
      <div class="hh-title" id="homeTitle">Koleksi Dr Excel</div>
      <div class="hh-search"><input id="hSearch" type="search" placeholder="Cari Sistem..." autocomplete="off"></div>
      <div class="hh-filter"><select id="hCat"></select></div>
    </header>
    <div id="homeLoading" class="loading hidden">Memuatkan produk...</div>
    <div id="productGrid" class="grid"></div>
    <div id="homeEmpty" class="empty hidden">Tiada produk dijumpai.</div>
  </section>

  <!-- BAKUL -->
  <section id="page-bakul" class="page">
    <div class="card pad" id="infoCard" style="margin-top:10px">
      <input id="coNama" placeholder="Nama">
      <div class="row" style="margin-top:6px">
        <input id="coWasap" placeholder="No whatsapp">
        <input id="coEmail" type="email" placeholder="Email">
      </div>
      <input id="coSocmed" placeholder="Nama socmed (optional)" style="margin-top:6px">
      <textarea id="notaText" rows="3" placeholder="Nota (nak custom, demo etc)" style="margin-top:6px"></textarea>
    </div>
    <div class="row" id="bayarBtns" style="margin-top:10px">
      <button id="bayarTransferBtn" class="btn">Transfer</button>
      <button id="bayarQrBankBtn" class="btn">QR Bank</button>
      <button id="bayarQrTngBtn" class="btn">QR TnG</button>
    </div>
    <div class="row" id="bayarStatusRow" style="margin-top:10px">
      <label class="radio-pill"><input type="radio" name="bayarStatus" id="bayarDah" value="dah"> <span>Dah bayar</span></label>
      <label class="radio-pill"><input type="radio" name="bayarStatus" id="bayarBelum" value="belum" checked> <span>Belum bayar</span></label>
    </div>
    <div id="cartList" style="margin-top:10px"></div>
    <div class="card pad hidden" id="jumlahCard" style="margin-top:10px">
      <div id="cartTotal"></div>
      <div class="row" style="margin-top:8px">
        <button id="clearCartBtn" class="btn block">Empty</button>
        <button id="hantarBtn" class="btn primary block">Hantar</button>
      </div>
    </div>
    <div class="card pad" id="stepCard" style="margin-top:10px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h3 style="margin:0">Step Dapatkan Sistem</h3>
        <button id="stepEditBtn" class="btn small admin-only hidden">Edit</button>
      </div>
      <div id="stepContent" style="margin-top:8px;white-space:pre-wrap"></div>
      <div id="stepEditBox" class="hidden" style="margin-top:8px">
        <textarea id="stepText" rows="5" placeholder="Tulis langkah mendapatkan sistem..."></textarea>
        <div class="row" style="margin-top:8px">
          <button id="stepSaveBtn" class="btn primary">Simpan</button>
          <button id="stepCancelBtn" class="btn">Batal</button>
        </div>
      </div>
    </div>
  </section>

  <!-- TESTIMONI -->
  <section id="page-testimoni" class="page">
    <div class="row" style="justify-content:flex-end">
      <button id="testiEditBtn" class="btn small admin-only hidden">Edit</button>
    </div>
    <button id="addTestiBtn" class="btn primary block admin-only hidden">+ Tambah Testimoni</button>
    <div id="testiList" class="stack" style="margin-top:10px"></div>
  </section>

  <!-- TENTANG -->
  <section id="page-tentang" class="page">
    <div class="row" style="justify-content:flex-end">
      <button id="aboutEditBtn" class="btn small admin-only hidden">Edit</button>
    </div>
    <div id="aboutCard" class="card pad"></div>
  </section>

  <!-- SOCMED -->
  <section id="page-socmed" class="page">
    <div class="row" style="justify-content:flex-end">
      <button id="socmedEditBtn" class="btn small admin-only hidden">Edit</button>
    </div>
    <div id="socmedGrid" class="socmed-grid"></div>
    <div id="socmedEditCard" class="card pad hidden" style="margin-top:10px">
      <div id="socmedInputs"></div>
      <button id="socmedSaveBtn" class="btn primary block">Simpan Link Socmed</button>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button id="adminFab" class="admin-fab-static">Admin</button>
    </div>
  </section>

  <!-- ADMIN: TETAPAN -->
  <section id="page-tetapan" class="page admin-only">
    <button id="logoutBtn" class="btn block" style="margin-top:0">Logout</button>
    <div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px">Website</h3>
      <div class="row">
        <input id="sWhatsapp" placeholder="Nombor WhatsApp 601...">
        <input id="sHeader" placeholder="Header">
      </div>
      <div class="row" style="margin-top:8px">
        <input id="sLogo" placeholder="URL logo / uploads/...">
        <button id="sLogoUp" class="btn">Upload</button>
        <input id="sLogoFile" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" class="hidden">
      </div>
      <input id="sPengumuman" placeholder="Teks bar pengumuman (kosong = sorok)" style="margin-top:8px">
      <button id="webSaveBtn" class="btn primary block">Simpan Website</button>
    </div>
    <div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px">Kategori</h3>
      <div class="row">
        <input id="cNama" placeholder="Nama kategori baharu">
        <button id="cAddBtn" class="btn primary">Tambah</button>
      </div>
      <div id="catList" class="stack" style="margin-top:8px"></div>
    </div>
    <div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px">Bayar</h3>
      <input id="bBankNama" placeholder="Nama bank" style="margin-top:6px">
      <input id="bBankNo" placeholder="No akaun bank" style="margin-top:6px">
      <input id="bBankPenama" placeholder="Penama akaun bank" style="margin-top:6px">
      <div class="row" style="margin-top:8px">
        <input id="bQrBank" placeholder="URL QR bank / uploads/...">
        <button id="bQrBankUp" class="btn">Upload</button>
        <input id="bQrBankFile" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" class="hidden">
      </div>
      <div class="row" style="margin-top:8px">
        <input id="bQrTng" placeholder="URL QR TnG / uploads/...">
        <button id="bQrTngUp" class="btn">Upload</button>
        <input id="bQrTngFile" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" class="hidden">
      </div>
      <button id="bayarSaveBtn" class="btn primary block">Simpan Bayar</button>
    </div>
    <div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px">Analisis</h3>
      <div id="miniChart"></div>
      <h4 style="margin:12px 0 8px">Top 10 produk paling diklik</h4>
      <div id="topChart"></div>
      <button id="miniRefresh" class="btn block">Muat Semula Carta</button>
    </div>
    <div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px">Admin</h3>
      <div class="row">
        <input id="sAdminUser" placeholder="Username baharu">
        <input id="sAdminPass" type="password" placeholder="Password baharu (kosong=tidak tukar)">
      </div>
      <button id="adminSaveBtn" class="btn primary block">Simpan Admin</button>
    </div>
    <div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px">Data</h3>
      <div class="row">
        <button id="exportDataBtn" class="btn primary">Export Data</button>
        <button id="exportLainBtn" class="btn primary">Export Lain</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="exportAnaBtn" class="btn primary">Export Analisis</button>
        <button id="importBtn" class="btn">Import</button>
        <input id="importFile" type="file" accept=".xlsx,.xls" class="hidden">
      </div>
    </div>
  </section>
</main>

<!-- BOTTOM NAV -->
<nav id="bottomNav" class="bottom-nav">
  <button data-page="home" class="nav-btn active"><span class="ico">🏠</span><span>Home</span></button>
  <button data-page="bakul" class="nav-btn"><span class="ico">🛒</span><span>Bakul</span><b id="cartBadge" class="badge hidden">0</b></button>
  <button data-page="testimoni" class="nav-btn"><span class="ico">⭐</span><span>Testimoni</span></button>
  <button data-page="tentang" class="nav-btn"><span class="ico">👤</span><span>Tentang</span></button>
  <button data-page="socmed" class="nav-btn"><span class="ico">🔗</span><span>Socmed</span></button>
  <button data-page="tetapan" class="nav-btn admin-only hidden"><span class="ico">⚙️</span><span>Tetapan</span></button>
</nav>

<!-- Butang terapung WhatsApp (ikon diisi JS dari SOCMED_SVG) -->
<button id="waFloat" class="wa-float hidden" title="WhatsApp Dr Excel" aria-label="WhatsApp Dr Excel"></button>

<!-- Modal login -->
<div id="loginModal" class="modal hidden">
  <div class="modal-card">
    <h3>Login Admin</h3>
    <input id="loginUser" placeholder="Username" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <div id="loginErr" class="err hidden"></div>
    <div class="row">
      <button id="loginSubmit" class="btn primary">Login</button>
      <button id="loginCancel" class="btn">Batal</button>
    </div>
  </div>
</div>

<!-- Modal detail produk (tutup dengan klik luar kotak) -->
<div id="detailModal" class="modal hidden">
  <div class="modal-card wide">
    <div id="detailBody"></div>
  </div>
</div>

<!-- Modal edit tentang -->
<div id="aboutModal" class="modal hidden">
  <div class="modal-card">
    <h3>Edit Tentang</h3>
    <div class="row" style="margin-top:8px">
      <input id="aGambar" placeholder="URL gambar profil">
      <button id="aUpBtn" class="btn">Upload</button>
      <input id="aFile" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" class="hidden">
    </div>
    <input id="aNama" placeholder="Nama" style="margin-top:8px">
    <input id="aBiodata" placeholder="Biodata ringkas" style="margin-top:8px">
    <input id="aLink" placeholder="Link ke site lain https://..." style="margin-top:8px">
    <div style="margin-top:8px">
      <label class="hint">Sijil (gambar, boleh pilih banyak)</label>
      <div class="row" style="margin-top:6px">
        <button id="aSijilUpBtn" class="btn" type="button">Upload Sijil</button>
        <input id="aSijilFile" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" multiple class="hidden">
      </div>
      <div id="aSijilList" class="stack" style="margin-top:8px"></div>
    </div>
    <div class="row">
      <button id="aSaveBtn" class="btn primary">Simpan</button>
      <button id="aCancelBtn" class="btn">Batal</button>
    </div>
  </div>
</div>

<!-- Modal produk baharu (admin, dari Home) -->
<div id="productModal" class="modal hidden">
  <div class="modal-card wide">
    <h3>Tambah Produk Baharu</h3>
    <input id="npNama" placeholder="Nama produk">
    <input id="npDemo" placeholder="Link demo https://..." style="margin-top:8px">
    <div class="row" style="margin-top:8px">
      <select id="npKategori"></select>
      <input id="npGambar" placeholder="URL gambar / uploads/...">
    </div>
    <textarea id="npPenerangan" rows="2" placeholder="Penerangan ringkas" style="margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px">
      <input id="npHargaSebelum" type="number" min="0" step="0.01" placeholder="Harga sebelum (RM)">
      <input id="npHargaSelepas" type="number" min="0" step="0.01" placeholder="Harga selepas (RM)">
    </div>
    <div class="row" style="margin-top:8px">
      <input id="npFile" type="file" accept=".png,.jpg,.jpeg,.webp,.gif">
      <button id="npUploadBtn" class="btn">Upload</button>
    </div>
    <img id="npPreview" class="hidden" style="width:100%;border-radius:10px;margin-top:8px;aspect-ratio:16/9;object-fit:cover">
    <div class="row">
      <button id="npSaveBtn" class="btn primary">Simpan Produk</button>
      <button id="npCancelBtn" class="btn">Batal</button>
    </div>
  </div>
</div>

<!-- Modal testimoni -->
<div id="testiModal" class="modal hidden">
  <div class="modal-card">
    <h3 id="testiTitle">Tambah Testimoni</h3>
    <input id="tNama" placeholder="Nama pelanggan">
    <div class="row">
      <select id="tRating">
        <option value="5">★★★★★ (5)</option>
        <option value="4">★★★★ (4)</option>
        <option value="3">★★★ (3)</option>
        <option value="2">★★ (2)</option>
        <option value="1">★ (1)</option>
      </select>
    </div>
    <input id="tLink" placeholder="Link site testimoni https://...">
    <textarea id="tKomen" rows="3" placeholder="Komen pelanggan"></textarea>
    <div class="row">
      <button id="tSaveBtn" class="btn primary">Simpan</button>
      <button id="tCancelBtn" class="btn">Batal</button>
    </div>
  </div>
</div>

<!-- Modal bayar (popup dari butang Transfer / QR Bank / QR TnG di Bakul) -->
<div id="bayarModal" class="modal hidden">
  <div class="modal-card">
    <div id="bayarBody"></div>
    <div class="row">
      <button id="bayarTutupBtn" class="btn block">Tutup</button>
    </div>
  </div>
</div>

<!-- Modal magnify sijil -->
<div id="sijilModal" class="modal hidden">
  <div class="modal-card wide">
    <img id="sijilImg" style="width:100%;border-radius:10px;object-fit:contain">
  </div>
</div>

<!-- Modal confirm generik -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-card">
    <p id="confirmText">Padam?</p>
    <div class="row">
      <button id="confirmYes" class="btn danger">Ya, Teruskan</button>
      <button id="confirmNo" class="btn">Batal</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="loader" class="loader hidden"><div class="spin"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script src="js/analytics.js"></script>
<script src="js/backup.js"></script>
</body>
</html>
